<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="t d">
  <title id="t">Platinum 3DS — New 3DS Edition</title>
  <desc id="d">Hand-made banner for the personal-use New 3DS port. No game art.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0d0f1a"/><stop offset="50%" stop-color="#1c1a2e"/><stop offset="100%" stop-color="#2a1f3d"/></linearGradient>
    <linearGradient id="plat" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#a7a9b8"/><stop offset="40%" stop-color="#f1f2f7"/><stop offset="75%" stop-color="#c4c6d4"/><stop offset="100%" stop-color="#8d8fa3"/></linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#f5b942"/><stop offset="100%" stop-color="#d9534f"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="40"/></filter>
  </defs>
  <rect width="1280" height="360" fill="url(#bg)"/>
  <circle cx="1060" cy="90" r="160" fill="#7b4fc9" opacity="0.35" filter="url(#blur)"/>
  <circle cx="200" cy="300" r="140" fill="#d9534f" opacity="0.25" filter="url(#blur)"/>
  <g opacity="0.15" stroke="#c4c6d4" fill="none">
    <polygon points="1040,60 1140,120 1140,240 1040,300 940,240 940,120"/>
    <polygon points="1040,100 1105,140 1105,220 1040,260 975,220 975,140"/>
  </g>
  <text x="80" y="165" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="88" font-weight="800" fill="url(#plat)">Platinum 3DS</text>
  <rect x="82" y="190" width="300" height="6" rx="3" fill="url(#acc)"/>
  <text x="82" y="245" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#d6d7e3">A native New 3DS port · bring your own ROM</text>
  <text x="82" y="290" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#8d8fa3">pspoke + melonDS based · personal use · GPL-3.0</text>
</svg>
